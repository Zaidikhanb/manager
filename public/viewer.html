<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araiyan Pind Unit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="12" y2="17"/>
          </svg>
        </div>
        <div>
          <div class="logo-text">Unit Inventory</div>
          <div class="logo-sub">Araiyan Pind</div>
        </div>
      </div>
      <div style="padding:16px;text-align:center;color:var(--text3);font-size:11px;">
        Read‑only access
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search items...">
        </div>
      </header>

      <div class="content">
        <div>
          <h1 class="page-title">Inventory Overview</h1>
          <p class="page-subtitle">Live view of all items organized by status</p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div id="sectionsContainer" class="sections-container" style="position:relative; min-height:200px;">
          <div id="loadingSpinner" class="loading-overlay hidden">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
