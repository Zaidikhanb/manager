<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StockFlow · Pure Inventory Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1119;
      --surface: #1a1d28;
      --surface2: #222634;
      --surface3: #2a2e3c;
      --text: #e2e4ec;
      --text2: #a8adbd;
      --text3: #787d8c;
      --accent: #6c5ce7;
      --green: #00d2a0;
      --blue: #4dabf7;
      --purple: #b197fc;
      --orange: #ff9f43;
      --red: #ff6b6b;
      --yellow: #ffd43b;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.45);
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      width: 100%;
      min-width: 1000px;
      overflow-x: auto;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* main app wrapper - full width, no sidebar */
    .app-wrapper {
      width: 100%;
      max-width: 1440px;
      background: var(--bg);
    }

    /* ----- MAIN CONTENT (full width) ----- */
    .main {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 28px;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text3);
    }

    .search-wrap input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      background: var(--surface2);
      border: 1px solid transparent;
      border-radius: 30px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(108,92,231,0.1);
    }

    .content {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff, #b6b9d0);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .page-subtitle {
      color: var(--text3);
      font-size: 13px;
      margin-top: 4px;
    }

    /* stats cards (7 cards) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      background: var(--surface2);
    }

    .stat-card.active-section {
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px rgba(108,92,231,0.3);
      background: rgba(108,92,231,0.05);
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .stat-icon svg {
      width: 18px;
      height: 18px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 4px;
    }

    /* sections container - all data cards */
    .sections-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: var(--transition);
    }

    .section-header:hover {
      background: var(--surface2);
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-icon svg {
      width: 18px;
      height: 18px;
    }

    .section-title {
      font-weight: 700;
      font-size: 15px;
    }

    .section-count {
      font-size: 13px;
      color: var(--text3);
      margin-left: 8px;
    }

    .section-toggle {
      transition: var(--transition);
      color: var(--text3);
    }

    .section-toggle svg {
      width: 18px;
      height: 18px;
    }

    .section-toggle.collapsed {
      transform: rotate(-90deg);
    }

    .section-body {
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
      overflow: hidden;
    }

    .section-body.collapsed {
      max-height: 0 !important;
      opacity: 0;
    }

    .section-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .section-table thead th {
      background: var(--surface2);
      padding: 11px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text3);
    }

    .section-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: var(--transition);
    }

    .section-table tbody tr:hover {
      background: var(--surface2);
    }

    .section-table tbody td {
      padding: 12px 16px;
      vertical-align: middle;
    }

    .item-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      background: rgba(108,92,231,0.15);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 24px;
      font-size: 11px;
      font-weight: 600;
      cursor: default;
    }

    .status-available   { background: rgba(0,210,160,0.12); color: var(--green); }
    .status-used        { background: rgba(77,171,247,0.12); color: var(--blue); }
    .status-installed   { background: rgba(177,151,252,0.12); color: var(--purple); }
    .status-reserved    { background: rgba(255,159,67,0.12); color: var(--orange); }
    .status-defective   { background: rgba(255,107,107,0.12); color: var(--red); }
    .status-short       { background: rgba(255,212,59,0.15); color: var(--yellow); }

    .qty-warning {
      color: var(--yellow);
      font-weight: 800;
      animation: softPulse 1.8s infinite;
    }

    @keyframes softPulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 0px rgba(255,212,59,0); }
      50% { opacity: 0.9; text-shadow: 0 0 4px rgba(255,212,59,0.5); }
    }

    .empty-section {
      text-align: center;
      padding: 42px 20px;
      color: var(--text3);
      font-size: 14px;
    }

    /* loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15,17,25,0.7);
      backdrop-filter: blur(3px);
      z-index: 60;
      border-radius: var(--radius);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(108,92,231,0.2);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden {
      display: none;
    }

    /* scroll styling */
    .section-body::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    .section-body::-webkit-scrollbar-track {
      background: var(--surface2);
      border-radius: 10px;
    }

    .section-body::-webkit-scrollbar-thumb {
      background: var(--text3);
      border-radius: 10px;
    }

    .section-body {
      scrollbar-width: thin;
    }

    /* responsive adjustments */
    @media (max-width: 1100px) {
      .stats-grid {
        gap: 10px;
      }
      .stat-value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <main class="main">
    <header class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="globalSearch" placeholder="Search items by name or serial...">
      </div>
    </header>

    <div class="content">
      <div>
        <h1 class="page-title">📦 Inventory Analytics</h1>
        <p class="page-subtitle">Live stock overview — expand/collapse categories, filter by status or search</p>
      </div>

      <!-- stats cards (filter by category) -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- dynamic sections (items grouped by status) -->
      <div id="sectionsContainer" class="sections-container" style="position: relative; min-height: 300px;">
        <div id="loadingSpinner" class="loading-overlay hidden">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // ---------- INVENTORY DATA ----------
  let inventoryItems = [];
  let currentFilterSection = 'all';     // 'all' or one of status keys
  let collapsedState = {};               // track collapsible sections: { available: true/false, ... }

  const SCROLLABLE_HEIGHT = "500px";

  // helper: generate rich demo data if API fails
  function generateRichInventory() {
    const statusKeys = ['available', 'used', 'installed', 'reserved', 'defective', 'short'];
    const productFamilies = [
      "Logi Master Mouse", "MechKey Pro", "Thunderbolt Dock", "UltraWide Monitor", "ErgoStand",
      "ANC Headphones", "StreamCam 4K", "NVMe SSD 2TB", "Gan Charger", "DeskMat Pro",
      "HDMI 2.1 Cable", "Studio Mic", "Bluetooth Adapter X", "Graphics Tablet"
    ];
    const itemsList = [];
    for (let i = 1; i <= 68; i++) {
      let baseStatus = statusKeys[i % statusKeys.length];
      let qtyBase = Math.floor(Math.random() * 42) + 1;
      if (baseStatus === 'short') qtyBase = Math.floor(Math.random() * 6) + 1;
      let nameIdx = i % productFamilies.length;
      let product = productFamilies[nameIdx] + (Math.floor(i / 5) > 0 ? ` Gen${Math.floor(i / 9)+1}` : '');
      itemsList.push({
        id: i,
        name: `${product} ${Math.floor(i/3)+1}`,
        number: `SN-${String(2300 + i).slice(1)}`,
        quantity: qtyBase,
        status: baseStatus,
        displayStatus: baseStatus,
        isShort: (baseStatus === 'short' && qtyBase < 6) || (baseStatus !== 'short' && qtyBase === 1 && i % 17 === 0)
      });
    }
    // handcrafted edge cases
    itemsList.push({ id: 201, name: "Premium Office Chair (Ergo)", number: "CHAIR-ELITE", quantity: 3, status: "short", displayStatus: "short", isShort: true });
    itemsList.push({ id: 202, name: "Wireless Presenter", number: "PR-9X", quantity: 14, status: "available", displayStatus: "available", isShort: false });
    itemsList.push({ id: 203, name: "Broken LCD Panel", number: "LCD-FAIL", quantity: 2, status: "defective", displayStatus: "defective", isShort: false });
    itemsList.push({ id: 204, name: "Conference Speaker", number: "SPKR-ARRAY", quantity: 5, status: "reserved", displayStatus: "reserved", isShort: false });
    itemsList.push({ id: 205, name: "Edge Router Pro", number: "ROUT-6E", quantity: 1, status: "used", displayStatus: "used", isShort: false });
    return itemsList;
  }

  // fetch or fallback
  async function loadInventory() {
    const spinner = document.getElementById('loadingSpinner');
    if(spinner) spinner.classList.remove('hidden');
    try {
      const response = await fetch('/api/items');
      if (!response.ok) throw new Error('API fail');
      const data = await response.json();
      inventoryItems = Array.isArray(data) ? data : generateRichInventory();
    } catch (err) {
      console.warn("Using fallback inventory data");
      inventoryItems = generateRichInventory();
    } finally {
      if(spinner) spinner.classList.add('hidden');
      renderDashboard();
    }
  }

  // group items by status
  function getStatusGroups() {
    const groups = {
      available: { label: 'Available', iconType: 'available', color: 'var(--green)', items: [] },
      used: { label: 'In Use', iconType: 'used', color: 'var(--blue)', items: [] },
      installed: { label: 'Installed', iconType: 'installed', color: 'var(--purple)', items: [] },
      reserved: { label: 'Reserved', iconType: 'reserved', color: 'var(--orange)', items: [] },
      defective: { label: 'Defective', iconType: 'defective', color: 'var(--red)', items: [] },
      short: { label: 'Low Stock', iconType: 'short', color: 'var(--yellow)', items: [] }
    };
    inventoryItems.forEach(item => {
      const statusKey = item.displayStatus || item.status;
      if (groups[statusKey]) groups[statusKey].items.push(item);
    });
    return groups;
  }

  // SVG getter for icons
  function getCategoryIcon(iconType) {
    const icons = {
      all: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>`,
      available: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>`,
      used: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`,
      installed: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
      reserved: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>`,
      defective: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      short: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
    };
    return icons[iconType] || icons.all;
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function escapeHtml(str) {
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if(m === '&') return '&amp;';
      if(m === '<') return '&lt;';
      if(m === '>') return '&gt;';
      return m;
    });
  }

  // render stat cards (with click filter)
  function renderStatsCards(activeSection) {
    const groups = getStatusGroups();
    const totalItems = inventoryItems.length;
    const statsList = [
      { key: 'all', label: 'All Items', color: '#6c5ce7', icon: 'all', count: totalItems },
      { key: 'available', label: 'Available', color: 'var(--green)', icon: 'available', count: groups.available.items.length },
      { key: 'used', label: 'In Use', color: 'var(--blue)', icon: 'used', count: groups.used.items.length },
      { key: 'installed', label: 'Installed', color: 'var(--purple)', icon: 'installed', count: groups.installed.items.length },
      { key: 'reserved', label: 'Reserved', color: 'var(--orange)', icon: 'reserved', count: groups.reserved.items.length },
      { key: 'defective', label: 'Defective', color: 'var(--red)', icon: 'defective', count: groups.defective.items.length },
      { key: 'short', label: 'Low Stock', color: 'var(--yellow)', icon: 'short', count: groups.short.items.length }
    ];

    const statsHtml = statsList.map(stat => `
      <div class="stat-card ${activeSection === stat.key ? 'active-section' : ''}" data-stat-key="${stat.key}">
        <div class="stat-icon" style="background:${stat.color}22; color:${stat.color}">
          ${getCategoryIcon(stat.icon)}
        </div>
        <div class="stat-value" style="color:${stat.color}">${stat.count}</div>
        <div class="stat-label">${stat.label}</div>
      </div>
    `).join('');
    document.getElementById('statsGrid').innerHTML = statsHtml;
    // attach click event to each stat card
    document.querySelectorAll('.stat-card').forEach(card => {
      card.addEventListener('click', (e) => {
        const key = card.getAttribute('data-stat-key');
        if(key) {
          currentFilterSection = key;
          renderStatsCards(currentFilterSection);
          renderInventorySections();
        }
      });
    });
  }

  // render sections (AVAILABLE / USED etc) based on currentFilterSection and search term
  function renderInventorySections() {
    const groups = getStatusGroups();
    const searchTerm = document.getElementById('globalSearch').value.toLowerCase().trim();
    const container = document.getElementById('sectionsContainer');
    
    let sectionsToRender = [];
    if (currentFilterSection === 'all') {
      sectionsToRender = Object.entries(groups);
    } else {
      const specificGroup = groups[currentFilterSection];
      if (specificGroup) sectionsToRender = [[currentFilterSection, specificGroup]];
      else sectionsToRender = [];
    }

    if (sectionsToRender.length === 0) {
      container.innerHTML = `<div class="empty-section" style="background:var(--surface); padding:3rem; border-radius:var(--radius);">✨ No items in this category</div>`;
      return;
    }

    let finalHtml = '';
    for (const [statusKey, section] of sectionsToRender) {
      let filteredItems = section.items.filter(item =>
        item.name.toLowerCase().includes(searchTerm) ||
        (item.number && item.number.toLowerCase().includes(searchTerm))
      );
      const itemCount = filteredItems.length;
      const isCollapsed = collapsedState[statusKey] || false;
      const maxHeightStyle = isCollapsed ? '0' : SCROLLABLE_HEIGHT;

      finalHtml += `
        <div class="section-card" data-section-key="${statusKey}">
          <div class="section-header" data-toggle="${statusKey}">
            <div class="section-header-left">
              <div class="section-icon" style="background:${section.color}22; color:${section.color}">
                ${getCategoryIcon(section.iconType)}
              </div>
              <span class="section-title">${section.label}</span>
              <span class="section-count">(${itemCount})</span>
            </div>
            <div class="section-toggle ${isCollapsed ? 'collapsed' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
          <div class="section-body ${isCollapsed ? 'collapsed' : ''}" id="body_${statusKey}" style="max-height: ${maxHeightStyle}; overflow-y: auto; overflow-x: auto;">
            ${itemCount === 0 ? `<div class="empty-section">📭 No items match your filter</div>` : `
              <table class="section-table">
                <thead>
                  <tr><th>Item Name</th><th>Serial / Number</th><th>Quantity</th><th>Status</th></tr>
                </thead>
                <tbody>
                  ${filteredItems.map(item => {
                    const warningClass = (item.isShort || (item.status === 'short' && item.quantity < 5)) ? 'qty-warning' : '';
                    const badgeStatus = item.displayStatus || item.status;
                    return `
                      <tr>
                        <td>
                          <div class="item-name">
                            <div class="item-avatar" style="background:${section.color}22;color:${section.color}">
                              ${escapeHtml(item.name.charAt(0).toUpperCase())}
                            </div>
                            <strong>${escapeHtml(item.name)}</strong>
                          </div>
                        </td>
                        <td>${escapeHtml(item.number || '—')}</td>
                        <td><span class="${warningClass}">${item.isShort ? '⚠ ' : ''}${item.quantity}</span></td>
                        <td><span class="status-badge status-${badgeStatus}">● ${capitalize(badgeStatus)}</span></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            `}
          </div>
        </div>
      `;
    }
    container.innerHTML = finalHtml;

    // attach toggle events to each section header
    for (const [statusKey] of sectionsToRender) {
      const header = document.querySelector(`.section-header[data-toggle="${statusKey}"]`);
      if (header) {
        header.addEventListener('click', (e) => {
          e.stopPropagation();
          collapsedState[statusKey] = !collapsedState[statusKey];
          const bodyDiv = document.getElementById(`body_${statusKey}`);
          const toggleIcon = header.querySelector('.section-toggle');
          if (bodyDiv) {
            if (collapsedState[statusKey]) {
              bodyDiv.style.maxHeight = '0';
              bodyDiv.classList.add('collapsed');
              if(toggleIcon) toggleIcon.classList.add('collapsed');
            } else {
              bodyDiv.style.maxHeight = SCROLLABLE_HEIGHT;
              bodyDiv.classList.remove('collapsed');
              if(toggleIcon) toggleIcon.classList.remove('collapsed');
            }
          }
        });
      }
    }
  }

  function fullRefresh() {
    renderStatsCards(currentFilterSection);
    renderInventorySections();
  }

  // global search listener
  function bindEvents() {
    const searchInput = document.getElementById('globalSearch');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        renderInventorySections();
      });
    }
  }

  function renderDashboard() {
    renderStatsCards(currentFilterSection);
    renderInventorySections();
    bindEvents();
  }

  // initialize app
