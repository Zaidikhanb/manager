<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow · Inventory Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrapper">
  <main class="main" style="width:100%;">
    <header class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search items...">
      </div>
      <div class="category-selector">
        <label for="categorySelect">Category:</label>
        <select id="categorySelect">
          <option value="all">All Items</option>
          <option value="available">Available</option>
          <option value="used">In Use</option>
          <option value="installed">Installed</option>
          <option value="reserved">Reserved</option>
          <option value="defective">Defective</option>
          <option value="short">Low Stock</option>
        </select>
      </div>
      <div id="walletDisplay" class="wallet-badge" style="cursor:pointer;">
        <span>💰 Wallet: </span><span id="walletBalance">0 PKR</span>
      </div>
    </header>

    <div class="content">
      <div>
        <h1 class="page-title">Inventory Overview</h1>
        <p class="page-subtitle">Browse items by category</p>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
      <div id="itemsContainer" style="position:relative; min-height:260px;">
        <div id="loadingSpinner" class="loading-overlay hidden">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Wallet transaction modal -->
<div id="walletModal" class="modal-overlay" style="display:none;">
  <div class="modal" style="width:700px; max-width:90%;">
    <h3>💰 Wallet Transactions</h3>
    <div style="max-height:500px; overflow-y:auto; margin:20px 0;">
      <table class="section-table" id="walletTransactionsTable">
        <thead>
          <tr><th>Date & Time</th><th>Type</th><th>Party / Purpose</th><th>Amount (PKR)</th></tr>
        </thead>
        <tbody id="walletTransactionsBody">
          <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button id="closeWalletModal" class="btn btn-secondary">Close</button>
    </div>
  </div>
</div>

<script src="viewer.js"></script>
</body>
</html>
