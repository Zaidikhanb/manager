<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="12" y2="17"/>
          </svg>
        </div>
        <div>
          <div class="logo-text">StockFlow</div>
          <div class="logo-sub">History</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="admin.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to Admin
        </a>
      </nav>
    </aside>
    <main class="main">
      <div class="content" style="max-width:800px; margin:0 auto;">
        <h1 class="page-title">Change History</h1>
        <p class="page-subtitle">Every addition, update, and deletion is recorded</p>
        <div style="position:relative; margin-top:20px;">
          <div id="loadingSpinner" class="loading-overlay hidden">
            <div class="spinner"></div>
          </div>
          <div id="historyList"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="history.js"></script>
</body>
</html>
