<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login overlay -->
  <div id="loginOverlay" class="login-container" style="display:none;">
    <div class="login-card">
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        Admin Login
      </h2>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="Enter password" autofocus>
        <div id="loginError" class="error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Admin content -->
  <div id="adminContent" class="app-wrapper" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="12" y2="17"/>
          </svg>
        </div>
        <div>
          <div class="logo-text">StockFlow</div>
          <div class="logo-sub">Admin Panel</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-section="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
          All Sections
        </div>
        <div class="nav-item" data-section="available">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          Available
        </div>
        <div class="nav-item" data-section="used">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          In Use
        </div>
        <div class="nav-item" data-section="installed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Installed
        </div>
        <div class="nav-item" data-section="reserved">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          Reserved
        </div>
        <div class="nav-item" data-section="defective">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Defective
        </div>
        <div class="nav-item" data-section="short">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Low Stock
        </div>
        <a href="history.html" class="nav-item" style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.05); padding-top:16px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History Log
        </a>
      </nav>
      <div style="padding:16px;">
        <button id="logoutBtn" class="btn btn-secondary" style="width:100%; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search items...">
        </div>
        <button class="btn btn-primary" id="btnAddItem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Item
        </button>
      </header>

      <div class="content">
        <div>
          <h1 class="page-title">Inventory Management</h1>
          <p class="page-subtitle">Manage items and change their status tags</p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div id="sectionsContainer" class="sections-container" style="position:relative; min-height:200px;">
          <div id="loadingSpinner" class="loading-overlay hidden">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <h3 id="modalTitle">Add New Item</h3>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <div class="form-group">
          <label>Item Name *</label>
          <input type="text" id="itemName" required>
        </div>
        <div class="form-group">
          <label>Number / Serial (optional)</label>
          <input type="text" id="itemNumber">
        </div>
        <div class="form-group">
          <label>Quantity *</label>
          <input type="number" id="itemQty" value="1" min="1" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="itemStatus">
            <option value="available">Available</option>
            <option value="used">In Use</option>
            <option value="installed">Installed</option>
            <option value="reserved">Reserved</option>
            <option value="defective">Defective</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
