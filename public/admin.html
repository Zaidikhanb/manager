<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login overlay -->
  <div id="loginOverlay" class="login-container" style="display:none;">
    <div class="login-card">
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        Admin Login
      </h2>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="Enter password" autofocus>
        <div id="loginError" class="error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Admin content (no sidebar) -->
  <div id="adminContent" class="app-wrapper" style="display:none;">
    <main class="main" style="width:100%;">
      <header class="topbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search items...">
        </div>
        <div class="category-selector">
          <label for="categorySelect">Category:</label>
          <select id="categorySelect">
            <option value="all">All Items</option>
            <option value="available">Available</option>
            <option value="used">In Use</option>
            <option value="installed">Installed</option>
            <option value="reserved">Reserved</option>
            <option value="defective">Defective</option>
            <option value="short">Low Stock</option>
          </select>
        </div>
        <div id="walletDisplay" class="wallet-badge">
          <span>💰 Wallet: </span><span id="walletBalance">0 PKR</span>
        </div>
        <button id="btnMoney" class="btn btn-secondary">💵 Money</button>
        <button id="btnAddItem" class="btn btn-primary">+ Add Item</button>
        <button id="logoutBtn" class="btn btn-secondary">🚪 Logout</button>
      </header>

      <div class="content">
        <div>
          <h1 class="page-title">Inventory Management</h1>
          <p class="page-subtitle">Manage items and change their status</p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div id="sectionsContainer" class="sections-container" style="position:relative; min-height:200px;">
          <div id="loadingSpinner" class="loading-overlay hidden">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <h3 id="modalTitle">Add New Item</h3>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <div class="form-group">
          <label>Item Name *</label>
          <input type="text" id="itemName" required>
        </div>
        <div class="form-group">
          <label>Number / Serial (optional)</label>
          <input type="text" id="itemNumber">
        </div>
        <div class="form-group">
          <label>Quantity *</label>
          <input type="number" id="itemQty" value="1" min="1" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="itemStatus">
            <option value="available">Available</option>
            <option value="used">In Use</option>
            <option value="installed">Installed</option>
            <option value="reserved">Reserved</option>
            <option value="defective">Defective</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Money transaction modal -->
  <div class="modal-overlay" id="moneyModal" style="display:none;">
    <div class="modal" style="max-width:400px;">
      <h3>💰 Money Transaction</h3>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="moneyReceivedBtn" class="btn btn-primary" style="flex:1;">Money Received</button>
        <button id="moneyUsedBtn" class="btn btn-secondary" style="flex:1;">Money Used</button>
      </div>
      <div class="modal-actions">
        <button id="closeMoneyModal" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
